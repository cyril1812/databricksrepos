<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="white" stroke-width="0.5">
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
  </g>
  <!-- Shield shape -->
  <path d="M128 40 L188 65 L188 130 C188 170 158 200 128 216 C98 200 68 170 68 130 L68 65 Z" 
        fill="url(#shield)" opacity="0.9" filter="url(#glow)"/>
  <!-- Shield inner highlight -->
  <path d="M128 52 L178 73 L178 128 C178 162 152 188 128 202 C104 188 78 162 78 128 L78 73 Z" 
        fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Diamond (UC symbol) -->
  <path d="M128 80 L148 105 L128 130 L108 105 Z" 
        fill="white" opacity="0.9"/>
  <!-- Checkmark -->
  <path d="M108 148 L122 162 L152 132" 
        fill="none" stroke="url(#check)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Small data dots -->
  <circle cx="55" cy="45" r="3" fill="#60A5FA" opacity="0.6"/>
  <circle cx="200" cy="50" r="2" fill="#34D399" opacity="0.6"/>
  <circle cx="45" cy="210" r="2.5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="210" cy="205" r="3" fill="#60A5FA" opacity="0.6"/>
  <!-- Text -->
  <text x="128" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.9">UC READINESS</text>
</svg>